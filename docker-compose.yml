services:
  hmpps-prisoner-finance-subscriptions-api:
    image: ghcr.io/ministryofjustice/hmpps-prisoner-finance-subscriptions-api:latest
    networks:
      - hmpps
    container_name: hmpps-prisoner-finance-subscriptions-api
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
    environment:
      - SERVER_PORT=8080
      - HMPPS_AUTH_URL=http://hmpps-auth:8080/auth
      - SPRING_PROFILES_ACTIVE=dev
      - DB_SERVER=hmpps-prisoner-finance-subscriptions-db
    depends_on:
      hmpps-auth:
        condition: service_started
      hmpps-prisoner-finance-subscriptions-db:
        condition: service_healthy
        restart: true
      localstack:
        condition: service_started

  localstack:
    image: localstack/localstack:community-archive
    networks:
      - hmpps
    container_name: localstack
    ports:
      - "4566:4566"
      - 8999:8080
    environment:
      - SERVICES=sns,sqs
      - DEFAULT_REGION=eu-west-2
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack"

  hmpps-prisoner-finance-subscriptions-db:
    container_name: hmpps-prisoner-finance-subscriptions-db
    image: postgres:16.15
    restart: always
    networks:
      - hmpps
    ports:
      - "5437:5432"
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=subscriptions
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  hmpps-auth:
    image: ghcr.io/ministryofjustice/hmpps-auth:latest
    networks:
      - hmpps
    container_name: hmpps-auth
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
    environment:
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=dev
      - APPLICATION_AUTHENTICATION_UI_ALLOWLIST=0.0.0.0/0

networks:
  hmpps:
