services:
  hmpps-prisoner-finance-subscriptions-api:
    image: ghcr.io/ministryofjustice/hmpps-prisoner-finance-subscriptions-api:latest
    networks:
      - hmpps
    container_name: hmpps-prisoner-finance-subscriptions-api
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
    environment:
      - SERVER_PORT=8080
      - HMPPS_AUTH_URL=http://hmpps-auth:8080/auth
      - SPRING_PROFILES_ACTIVE=dev
      - DB_SERVER=hmpps-prisoner-finance-subscriptions-db:5432
    depends_on:
      hmpps-prisoner-finance-subscriptions-db:
        condition: service_healthy
        restart: true

  hmpps-prisoner-finance-subscriptions-db:
    container_name: hmpps-prisoner-finance-subscriptions-db
    image: postgres:16.15
    restart: always
    networks:
      - hmpps
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=subscriptions
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  hmpps: