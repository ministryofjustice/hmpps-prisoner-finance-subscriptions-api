hmpps-auth:
  url: "http://localhost:8090/auth"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

spring:
  application:
    name: hmpps-prisoner-finance-subscriptions-api

  datasource:
    url: 'jdbc:postgresql://${DB_SERVER:localhost:5437}/${DB_NAME:subscriptions}?sslmode=prefer'
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}


subscriptions-api:
  client:
    id: ${SUBSCRIPTIONS_API_CLIENT_ID:hmpps-prisoner-finance-subscriptions-api-1}
    secret: ${SUBSCRIPTIONS_API_CLIENT_SECRET:clientsecret}

hmpps:
  sqs:
    provider: localstack
    queues:
      domainevents:
        queueName: prisoner-finance-event-queue
        dlqName: prisoner-finance-event-dlq
        subscribeTopicId: domainevents
        subscribeFilter: '{"eventType":[ "prison-offender-events.prisoner.merged"] }'
    topics:
      domainevents:
        arn: arn:aws:sns:eu-west-2:000000000000:11111111-2222-3333-4444-555555555555